<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temur kafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#6aa339;--g2:#4f8a2a;--g3:#2f5e17;--bg:#f4f9ec;--card:#fff;--text:#1f3a10;--muted:#5d7550;--line:#dcebc8;--y:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a09;--card:#182611;--text:#eef6e3;--muted:#a3bb91;--line:#2a3f1e}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,Montserrat,system-ui,sans-serif;font-weight:300;line-height:1.75;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--g2);color:#fff;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:.5px}
nav{display:flex;gap:26px}nav a{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:500;opacity:.9;position:relative}nav a:after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:#fff;transition:.3s}nav a:hover:after{width:100%}
@media(max-width:760px){nav{display:none}}
.brand img{width:42px;height:42px;border-radius:50%}
.btn{letter-spacing:1px;text-transform:uppercase;font-size:13px!important;display:inline-block;background:var(--y);color:#2b3a0a;border:0;border-radius:999px;padding:12px 24px;font:700 15px Montserrat,system-ui,sans-serif;cursor:pointer;transition:.2s}
.btn:hover{transform:scale(1.05)}
.btn.ghost{background:none;border:2px solid #fff;color:#fff}
.btn.green{background:var(--g2);color:#fff}
.btn.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,213,74,.7)}70%{box-shadow:0 0 0 16px rgba(255,213,74,0)}100%{box-shadow:0 0 0 0 rgba(255,213,74,0)}}
.hero{position:relative;background:linear-gradient(160deg,var(--g1),var(--g3));color:#fff;text-align:center;padding:60px 0 90px;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:50px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.leaf{position:absolute;font-size:46px;opacity:.25;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(15deg)}}
.hero img{width:190px;height:190px;border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,bob 5s 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1,h2,.tile h3,.sheet h3,.brand,.stat b{font-family:"Cormorant Garamond",Georgia,serif}
.hero h1{font-size:clamp(40px,8vw,72px);font-weight:600;line-height:1.05;margin:22px 0 12px;animation:up .8s .3s both}
.hero p{max-width:560px;margin:0 auto 26px;font-size:16px;opacity:.92;animation:up .8s .5s both}
.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:up .8s .7s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
section{padding:46px 0}
.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--g1);font-weight:600;display:block;margin-bottom:6px}
h2{font-size:clamp(34px,6vw,48px);font-weight:600;line-height:1.1;margin:0 0 8px;color:var(--g2)}
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.about p{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{padding:0;cursor:pointer;display:block;width:100%;background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;transition:.3s;aspect-ratio:1}
.stat img{display:block;width:100%;height:100%;object-fit:cover;transition:.5s}
.stat:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--g1);box-shadow:0 14px 30px rgba(79,138,42,.25)}
.stat:hover img{transform:scale(1.08)}
.cta{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;text-align:center;border-radius:28px;padding:48px 22px}
.cta h2{color:#fff}.cta p{margin:0 0 22px;opacity:.9}
.sub{color:var(--muted);margin:0 0 26px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:34px 24px;text-align:left;color:var(--text);cursor:pointer;font-family:inherit;transition:.25s}
.tile:hover{border-color:var(--g1);transform:translateY(-6px);box-shadow:0 14px 30px rgba(79,138,42,.22)}
.tile .ic{font-size:50px;display:inline-block;transition:.3s}.tile:hover .ic{transform:scale(1.2) rotate(-8deg)}
.tile h3{margin:10px 0 4px;font-size:32px;font-weight:600}.tile span{color:var(--muted);font-size:15px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px}
.box h3{margin:0 0 8px;color:var(--g2)}.box p{margin:0;color:var(--muted)}
.lks{display:flex;flex-direction:column;gap:14px}
.lk{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 20px;transition:.25s}
.lk:hover{border-color:var(--g1);transform:translateX(8px);box-shadow:0 10px 24px rgba(79,138,42,.18)}
.lk i{font-style:normal;font-size:28px;width:52px;height:52px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.lk span{flex:1}.lk b{display:block;font-size:17px;font-weight:600;color:var(--g2)}.lk small{color:var(--muted);font-size:14px}
.lk u{text-decoration:none;font-size:30px;color:var(--g1);transition:.25s}.lk:hover u{transform:translateX(5px)}
.lks{max-width:720px}
.bn{display:block;border-radius:22px;transition:.3s;filter:drop-shadow(0 6px 14px rgba(40,90,20,.18))}
.bn img{display:block;width:100%;height:auto}
.bn:hover{transform:translateY(-5px) scale(1.02);filter:drop-shadow(0 14px 22px rgba(40,90,20,.3))}
.bn:active{transform:scale(.98)}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links .btn{background:var(--g2);color:#fff}
footer{background:var(--g3);color:#d6ebc0;padding:26px 0;text-align:center;font-size:14px}
.rv{opacity:0;transform:translateY(34px);transition:.7s}.rv.in{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(10,25,5,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:slide .35s ease-out}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h3{margin:0;font-size:32px;color:var(--g2)}
.x{background:var(--card);color:var(--text);border:2px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:up .5s both}
.item b{display:block;font-size:16px;font-weight:500}.item em{color:var(--g2);font-style:normal;font:700 15px Montserrat,system-ui,sans-serif}
.item .btn{background:var(--g2);color:#fff;padding:9px 16px;font-size:13px;white-space:nowrap}
.item .th{width:84px;height:84px;border-radius:16px;object-fit:cover;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.item .tx{flex:1;min-width:110px}
@media(max-width:480px){.item{flex-wrap:wrap}.item .btn{flex-basis:100%;text-align:center}}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
